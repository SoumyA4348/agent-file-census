[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "afscan"
version = "0.3.2"
description = "Scanner for hidden or malicious instructions in AI coding-agent files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
afscan = "afscan:cli"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["afscan"]
